[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatraking"
version = "1.0.0"
description = "GAtraking - Plateforme professionnelle de vision artificielle, surveillance d'infrastructures, analyse des evenements et gestion operationnelle"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "GAtraking" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "psutil>=5.9",
    "python-multipart>=0.0.9",
    "redis>=5.0",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.17"]
vision = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "fakeredis>=2.23"]

[tool.setuptools.packages.find]
include = ["ga*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
