# Cote serveur / cloud GAtraking : PostgreSQL + Redis + API
# Usage : docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gatraking
      POSTGRES_PASSWORD: ${GA_PG_PASSWORD:-changer-motdepasse}
      POSTGRES_DB: gatraking
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatraking"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      GA__DATA__DATABASE_URL: postgresql+psycopg2://gatraking:${GA_PG_PASSWORD:-changer-motdepasse}@postgres:5432/gatraking
      GA__DATA__REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
